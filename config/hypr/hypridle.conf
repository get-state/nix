general {
    lock_cmd = pidof hyprlock || hyprlock       # avoids starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn display on after resume
    ignore_dbus_inhibit = false
    ignore_wayland_inhibit = false
}

# STEP 1: Aggressive Dimming (1.5 minutes)
# Quickly drops brightness to 10% to protect the pixels if you step away.
listener {
    timeout = 90                                 # 1 min 30 secs
    on-timeout = brillo -O && brillo -S 10%        # save current brightness and dim to 10%
    on-resume = brillo -I                 # restore saved brightness
}

# STEP 2: Lock the Screen (2.5 minutes)
# Brings up hyprlock. Your lock screen should ideally be mostly pitch black.
listener {
    timeout = 150                                # 2 mins 30 secs
    on-timeout = loginctl lock-session           # command to lock
}

# STEP 3: Screen Off / DPMS (3 minutes)
# Turns off the OLED panel entirely. 100% black = 0% pixel wear.
listener {
    timeout = 180                                # 3 minutes
    on-timeout = hyprctl dispatch dpms off       # turn off screen
    on-resume = hyprctl dispatch dpms on         # turn on screen
}

# STEP 4: Suspend / Sleep (10 minutes)
# Puts the machine to sleep if left completely unattended.
listener {
    timeout = 600                                # 10 minutes
    on-timeout = systemctl suspend               # suspend PC
}
